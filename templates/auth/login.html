{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: var(--color-navy-dark);">
  <div style="width: 100%; max-width: 420px;" class="px-3">
    <div class="text-center mb-4">
      <svg class="seal mb-3" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:56px;height:56px;">
        <circle cx="50" cy="50" r="47" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="39" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        <path d="M50 28 L68 38 V58 C68 70 60 76 50 80 C40 76 32 70 32 58 V38 Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M42 52 L48 58 L60 44" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="eyebrow">Superior University</div>
      <h1 class="font-display text-white h3 mt-1">Registrar Portal</h1>
    </div>

    <div class="udms-card p-4 p-md-5" style="border-top: 4px solid var(--color-gold);">
      <h2 class="font-display h5 mb-1">Sign in</h2>
      <p class="text-muted small mb-4">Access for administrators, instructors, and students.</p>

      {% include "_flashes.html" %}

      <form method="POST">
        {{ csrf_token_field() }}
        <div class="mb-3">
          <label class="form-label small fw-medium" for="username">Username</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-medium" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <div class="text-end mb-4">
          <a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot password?</a>
        </div>
        <button class="btn btn-navy w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
