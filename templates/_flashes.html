{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="px-0 pb-3">
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else category }} py-2 px-3 mb-2" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
