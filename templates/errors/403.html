{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="font-display h3">403 — Access denied</h1>
  <p class="text-muted">You don't have permission to view this page.</p>
  <a href="{{ url_for('index') }}" class="btn btn-navy mt-2">Back to dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="text-center py-5">
  <h1 class="h3">403 — Access denied</h1>
  <a href="{{ url_for('auth.login') }}" class="btn btn-navy mt-2">Sign in</a>
</div>
{% endblock %}
