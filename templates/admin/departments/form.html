{% extends "base.html" %}
{% block title %}{{ 'Edit' if dept else 'Add' }} Department{% endblock %}
{% block content %}
<div class="mb-4">
  <div class="eyebrow">Academics</div>
  <h1 class="font-display">{{ 'Edit' if dept else 'Add' }} Department</h1>
  <p class="text-muted mb-0">{{ dept.name if dept else 'Create a new academic department.' }}</p>
</div>

<div class="udms-card p-4 p-md-5" style="max-width: 560px;">
  <form method="POST">
    {{ csrf_token_field() }}
    <div class="mb-3">
      <label class="form-label small fw-medium">Department Name <span class="text-danger">*</span></label>
      <input class="form-control" name="name" required value="{{ dept.name if dept else '' }}" placeholder="Computer Science">
    </div>
    <div class="mb-3">
      <label class="form-label small fw-medium">Code <span class="text-danger">*</span></label>
      <input class="form-control" name="code" required value="{{ dept.code if dept else '' }}" placeholder="CS">
    </div>
    <div class="mb-4">
      <label class="form-label small fw-medium">Building</label>
      <input class="form-control" name="building" value="{{ dept.building if dept else '' }}" placeholder="Block A">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-navy">{{ 'Update' if dept else 'Save' }} Department</button>
      <a href="{{ url_for('admin.departments_list') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
