{% extends "base.html" %}
{% block title %}{{ 'Edit' if course else 'Add' }} Course{% endblock %}
{% block content %}
<div class="mb-4">
  <div class="eyebrow">Academics</div>
  <h1 class="font-display">{{ 'Edit' if course else 'Add' }} Course</h1>
  <p class="text-muted mb-0">{{ course.title if course else 'Create a new course offering.' }}</p>
</div>

<div class="udms-card p-4 p-md-5" style="max-width: 640px;">
  <form method="POST">
    {{ csrf_token_field() }}
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label small fw-medium">Course Code <span class="text-danger">*</span></label>
        <input class="form-control" name="code" required value="{{ course.code if course else '' }}" placeholder="CS210">
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-medium">Credit Hours</label>
        <input class="form-control" type="number" name="credit_hours" value="{{ course.credit_hours if course else 3 }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-medium">Course Title <span class="text-danger">*</span></label>
      <input class="form-control" name="title" required value="{{ course.title if course else '' }}" placeholder="Data Structures">
    </div>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label small fw-medium">Department</label>
        <select class="form-select" name="department_id">
          <option value="">— None —</option>
          {% for d in departments %}
          <option value="{{ d.id }}" {{ 'selected' if course and course.department_id == d.id else '' }}>{{ d.name }} ({{ d.code }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label small fw-medium">Capacity</label>
        <input class="form-control" type="number" name="capacity" value="{{ course.capacity if course else 40 }}">
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-navy">{{ 'Update' if course else 'Save' }} Course</button>
      <a href="{{ url_for('admin.courses_list') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
